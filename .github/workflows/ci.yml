name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run poe lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run poe typecheck

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Keep LF on Windows checkout
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # Same lockfile as the laptop: Windows runners get the CUDA torch wheel (runs on CPU
      # there), Linux runners the CPU wheel. Unit tests never load a real model.
      - run: uv sync --locked
      - run: uv run poe test

  frontend:
    # React UI (frontend/): lint, typecheck, unit tests (mocked API) and production build.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  evalset-verify:
    # Byte checksums of the frozen evalset + leakcheck, on both OSes: a Windows checkout
    # that converted LF to CRLF would fail here (spec §10.2).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Keep LF on Windows checkout
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run antibros evalset verify
      - run: uv run antibros evalset leakcheck

  docker-build:
    # The one image of `docker compose up` (API + web UI). Reports its size (M6: ~3 GB budget).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/Dockerfile.api -t antibros-api:local .
      - name: Image size
        run: |
          docker image inspect antibros-api:local --format '{{.Size}}' \
            | awk '{printf "antibros-api:local %.2f GB\n", $1/1e9}' | tee -a "$GITHUB_STEP_SUMMARY"

  compose-smoke:
    # Fresh clone -> compose with fake providers + CC BY mini corpus -> /health + /ask.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/fresh_clone_test.py --repo . --ref ${{ github.sha }}
