[project]
name = "antibros"
version = "0.1.0"
description = "Evidence-based Q&A for muscle-building nutrition (protein & creatine) with cited RAG."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "numpy>=1.26",
    "structlog>=24.1",
    "torch>=2.5",
    "sentence-transformers>=3.0",
    "qdrant-client>=1.12",
    "transformers>=4.51",
    "huggingface-hub>=0.30",
]

[project.scripts]
antibros = "antibros.cli:app"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.2",
    "pytest-socket>=0.7",
    "pre-commit>=3.7",
    "poethepoet>=0.27",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/antibros"]

# --- PyTorch: CUDA wheels on Windows (laptop), CPU wheels on Linux (CI) ---
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[tool.uv]
environments = ["sys_platform == 'win32'", "sys_platform == 'linux'"]

# --- Tasks ---
[tool.poe.tasks]
lint = "ruff check src tests scripts"
format = ["_fmt", "_fix"]
_fmt = "ruff format src tests scripts"
_fix = "ruff check --fix src tests scripts"
typecheck = "mypy"
test = "pytest"
check = ["lint", "typecheck", "test"]
up = "docker compose up -d qdrant"
api = "antibros serve"
ui = "streamlit run ui/streamlit_app.py"

# --- Quality ---
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# PLW1514: open()/read_text()/write_text() without explicit encoding.
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PLW1514", "T20", "S602", "S604"]
preview = true
explicit-preview-rules = true

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["T20"]
# Test data deliberately contains typographic Unicode (curly quotes, dashes, NFD).
"tests/*" = ["RUF001"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests", "scripts"]
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["sentence_transformers.*", "qdrant_client.*", "torch.*", "transformers.*", "huggingface_hub.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: calls real external services (skipped by default)"]
addopts = "-m 'not integration' --disable-socket --allow-unix-socket -q"
