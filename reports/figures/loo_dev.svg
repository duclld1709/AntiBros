  .dot { fill: #2a78d6; stroke: #fcfcfb; stroke-width: 2; }
  .hollow { fill: #fcfcfb; stroke: #2a78d6; stroke-width: 2; }
  @media (prefers-color-scheme: dark) {
    .surface { fill: #1a1a19; }
    .ink, .label { fill: #f0efec; }
    .muted { fill: #c3c2b7; }
